on:
  - push
  - delete

jobs:
  checkout:
    runs-on: ubuntu-latest
    name: get latest kg
    steps:
      - uses: actions/checkout@v4
        with:
          repository: soilwise-he/soil-health-knowledge-graph
          path: kg
  widoco:
    needs: checkout
    runs-on: ubuntu-latest
    name: A conversion of ttl to html
    container:
      image: ghcr.io/dgarijo/widoco:v1.4.25
      volumes:
        - ./kg:/in
        - ./html:/out
    steps:
      - run: echo "" > /usr/local/widoco/config/config.properties
      - run: java -jar /usr/local/widoco/widoco.jar -ontFile /in/soil_health_KG.ttl -outFolder /out -rewriteAll -uniteSections -excludeProvenance -getOntologyMetadata
  pushhtml:
    needs: widoco
    runs-on: ubuntu-latest
    name: push latest html to gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          repository: soilwise-he/soil-health
          ref: gh-pages
          path: pages
      - name: Copy files
        run: |
          cp -R  ./html ./pages
      - name: Commit files
        run: |
          cd pages
          git config --local user.email "noreply@lsc-hubs.org"
          git config --local user.name "github-actions[bot]"
          git add --all
          git commit -a -m "Add converted"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages  
          directory: pages
