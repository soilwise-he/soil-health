# Workflow for building and deploying a ttl website using widoco
name: Deploy ttl knowledge graph as html

on:
  # Runs on pushes targeting the default branch
  push:
    branches: [$default-branch]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          repository: soilwise-he/soil-health-knowledge-graph
          fetch-depth: 2
          path: '.'
      - run: |
          git checkout HEAD^
          mkdir ./public
          chmod -R 777 ./public
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: widoco
        id: widoco
        uses: soilwise-he/widoco-action@v0.3
        with:
          file-input: /github/workspace/soil_health_KG.ttl
          folder-output: /github/workspace/public
          options: -excludeProvenance -getOntologyMetadata
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - run: mv -f ./public/index-en.html ./public/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

